# Linux release hardening: full RELRO and a non-executable stack. PIE is already
# the default for Rust binaries on this target, and forcing `relocation-model=pie`
# globally breaks proc-macro dylibs, so it is not set here. These flags apply to
# every profile (Rust has no per-profile rustflags) and cost nothing meaningful
# in dev builds.
[target.'cfg(target_os = "linux")']
rustflags = [
  "-C", "link-arg=-Wl,-z,relro",
  "-C", "link-arg=-Wl,-z,now",
  "-C", "link-arg=-Wl,-z,noexecstack",
]
