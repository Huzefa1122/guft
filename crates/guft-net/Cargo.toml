[package]
name = "guft-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
guft-core = { path = "../guft-core" }
arti-client = { version = "0.46", default-features = false, features = [
    "tokio", "rustls", "compression", "onion-service-client", "onion-service-service",
    "experimental-api", "ephemeral-keystore", "keymgr", "vanguards", "restricted-discovery",
] }
sha2 = "0.11.0"
rand = "0.9"
thiserror = "2.0.21"
futures = "0.3.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

tokio-util = { version = "0.7.19", features = ["compat"], optional = true }
tor-hscrypto = "0.46"
tor-llcrypto = "0.46"
tor-hsservice = "0.46"
tor-cell = "0.46"
tor-keymgr = "0.46"
tor-config = "0.46"
tor-guardmgr = "0.46"
tor-rtcompat = "0.46"
safelog = "0.9"
tor-proto = "0.46"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
zeroize = "1.9.0"

[features]
# In-memory network for tests and demos; never enabled in the app.
mem = ["dep:tokio-util", "tokio/io-util"]

[dev-dependencies]
guft-net = { path = ".", features = ["mem"] }
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
