[package]
name = "guft-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
guft-core = { path = "../guft-core" }
guft-store = { path = "../guft-store" }
guft-net = { path = "../guft-net" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3.34"
thiserror = "2.0.21"
sha2 = "0.11.0"
data-encoding = "2.11.1"
zeroize = "1.9.0"
rand = "0.9"

[features]
# In-memory backend so the whole app can be tested without Tor.
mem = ["guft-net/mem"]

[dev-dependencies]
guft-app = { path = ".", features = ["mem"] }
tempfile = "3"
zeroize = "1.9.0"
