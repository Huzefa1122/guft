# cargo-deny: licenses must stay AGPL-3.0-compatible, advisories must be clean
# (or explicitly ignored with a reason), and all sources must be pinned.
[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa via Arti; guft never performs RSA private-key operations. See .cargo/audit.toml." },
  { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained; pulled in upstream (not used for any wire format)." },
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; build-time macro only." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; build-time macro only." },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained; build-time macro only." },
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter unsoundness; fixed only in glib 0.19+, which Tauri's GTK 0.18 stack does not allow yet. guft does not use VariantStrIter. Re-check on every Tauri bump." },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/signalapp/libsignal",
  "https://github.com/signalapp/SparsePostQuantumRatchet.git",
]
