[workspace]
resolver = "2"
members = ["crates/nochat-core", "crates/nochat-store"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.4" }

# Keep password hashing fast enough in debug/test builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = "symbols"
