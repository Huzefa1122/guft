[workspace]
resolver = "2"
members = ["crates/guft-core", "crates/guft-store", "crates/guft-net", "crates/guft-app", "crates/guft-harden", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.103.1" }

# Keep password hashing fast enough in debug/test builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = "symbols"
